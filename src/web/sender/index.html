<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>FileEquinox Host Dashboard</title>
		<link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
		<link rel="stylesheet" href="assets/style.css" />
	</head>
	<body>
		<div class="header">
			<div class="header-left">
				<h2>🚀 FileEquinox Host</h2>
				<span class="root-dir" id="root-dir">📁 Loading path...</span>
			</div>
			<div class="header-right">
				<div class="status active" id="status">🟢 Active</div>
				<div id="connection-link">
					🔗 Link:
					<a
						href="#"
						id="link-anchor"
						style="color: #ffa500; text-decoration: none"
						>---</a
					>
				</div>
				<div id="user-count">👥 Users: 0</div>
				<button class="kill-switch" id="kill-btn">STOP SERVER</button>
			</div>
		</div>

		<div class="container">
			<div class="userinfo">
				Sharing as <a id="user" href="#">Anita Intan</a>
			</div>

			<div class="dashboard-grid">
				<div class="left-column">
					<div class="panel">
						<h3>📥 Active Client Transfers</h3>
						<div id="transfers-container">
							<div class="empty-notice">
								No active file transfers.
							</div>
						</div>
					</div>

					<div class="panel">
						<h3>⚙️ Host Server Configurations</h3>
						<form class="settings-form" id="settings-form">
							<div class="form-group">
								<label for="server-port"
									>Network Port Configuration</label
								>
								<input
									type="number"
									id="server-port"
									required
								/>
							</div>
							<div class="form-group">
								<label for="shared-path"
									>Shared Local Root Directory</label
								>
								<div style="display: flex; gap: 10px">
									<input
										type="text"
										id="shared-path"
										required
										style="flex-grow: 1"
									/>
									<button
										type="button"
										id="browse-btn"
										class="save-btn"
										style="
											margin: 0;
											padding: 0 15px;
											white-space: nowrap;
										"
									>
										Browse...
									</button>
								</div>
							</div>
							<button
								type="submit"
								class="save-btn"
								id="save-settings-btn"
							>
								Apply & Restart Server
							</button>
						</form>

						<div class="form-group" style="margin-top: 15px">
							<label for="tunnel-toggle"
								>Public Share Tunnel</label
							>
							<div class="tunnel-row">
								<button
									type="button"
									id="tunnel-toggle"
									class="save-btn"
								>
									Enable Tunnel
								</button>
								<a href="#" id="tunnel-url" class="tunnel-url"
									>No public link yet</a
								>
							</div>
						</div>
					</div>
				</div>

				<div class="panel">
					<h3>📜 Live System Activity</h3>
					<div class="log-console" id="log-console"></div>
				</div>
			</div>
		</div>

		<script src="logic/index.js"></script>
	</body>
</html>
