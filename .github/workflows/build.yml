name: Build Desktop Application

permissions:
    contents: write

on:
    workflow_run:
        workflows:
            - Continuous Deployment
        types:
            - completed
    workflow_dispatch: # Allows you to manually trigger the build from GitHub UI

jobs:
    release:
        runs-on: ${{ matrix.os }}

        strategy:
            matrix:
                # Runs two separate builds simultaneously on native Windows & Ubuntu runners
                os: [windows-latest, ubuntu-latest]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build Electron App
              run: npx electron-builder
              env:
                  # Necessary for GitHub API interactions if you automate releases later
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Upload Release Assets
              if: github.event.workflow_run.conclusion == 'success'
              shell: bash
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName')"

                  echo "Uploading assets to release: $TAG"

                  shopt -s nullglob

                  files=(
                    dist/*.exe
                    dist/*.msi
                    dist/*.AppImage
                    dist/*.snap
                    dist/*.deb
                  )

                  if [ ${#files[@]} -eq 0 ]; then
                    echo "No release assets found."
                    exit 1
                  fi

                  gh release upload "$TAG" "${files[@]}" --clobber
