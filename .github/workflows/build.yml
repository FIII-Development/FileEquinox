name: Build Desktop Application

permissions:
    contents: write

on:
    workflow_run:
        workflows:
            - Continuous Deployment
        types:
            - completed
    workflow_dispatch: # Allows you to manually trigger the build from GitHub UI

jobs:
    release:
        runs-on: ${{ matrix.os }}

        strategy:
            matrix:
                os: [windows-latest, ubuntu-latest]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --legacy-peer-deps

            - name: Build Electron App
              run: npx electron-builder
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Upload Artifacts to Action Run
              uses: actions/upload-artifact@v4
              with:
                  name: electron-build-${{ matrix.os }}
                  path: |
                      dist/*.exe
                      dist/*.msi
                      dist/*.AppImage
                      dist/*.snap
                      dist/*.deb
                  if-no-files-found: warn

            - name: Upload Release Assets
              if: |
                  github.event_name == 'workflow_dispatch' || 
                  (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
              shell: bash
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName')"
                  
                  if [ -z "$TAG" ]; then
                    echo "Error: No GitHub Release found to upload assets to."
                    exit 1
                  fi
                  
                  echo "Uploading assets to release: $TAG"
                  shopt -s nullglob
                  files=(
                    dist/*.exe
                    dist/*.msi
                    dist/*.AppImage
                    dist/*.snap
                    dist/*.deb
                  )
                  if [ ${#files[@]} -eq 0 ]; then
                    echo "No release assets found in dist/ directory."
                    exit 1
                  fi
                  gh release upload "$TAG" "${files[@]}" --clobber
